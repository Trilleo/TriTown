# TriTown Configuration

# A friendly prefix shown before plugin messages
message-prefix: "<click:run_command:/tritown help><gradient:yellow:gold>[TriTown]"

# Message language. "auto" shows each player their Minecraft client language when TriTown has it
# (clients in an unsupported language see en_US). Set a language id such as "en_US" or "zh_CN" to use it for everyone.
# Translations live in plugins/TriTown/lang/ and can be edited or extended with new <id>.yml files.
language: auto

# ── Economy ─────────────────────────────────────────────────────────────────
economy:
  # Turn the economy off entirely. TriTown then needs another plugin to supply one.
  enabled: true

  provider:
    # Who supplies the server's Vault economy.
    #   internal - TriTown always supplies it, at the highest priority
    #   external - TriTown never supplies it and uses another plugin's instead
    #   auto     - TriTown supplies it unless one of the plugins below is installed
    # Changing this needs a restart: TriTown has to register with Vault before
    # Towny starts up, which happens before any plugin can be reloaded.
    mode: auto
    # Checked by plugin name. An economy plugin not listed here still wins, because
    # "auto" registers at a low service priority.
    defer-to:
      - Essentials
      - EssentialsX
      - CMI
      - XConomy
      - GemsEconomy
      - iConomy
      - BOSEconomy
      - EconomyAPI

  currency:
    # Stable key used in storage and commands. Never shown to players.
    id: dollar
    singular: Dollar
    plural: Dollars
    symbol: "$"
    # Digits kept after the decimal point. Balances are stored as whole units of the
    # smallest denomination, so changing this once accounts exist stops the plugin
    # unless storage.allow-rescale is turned on.
    fractional-digits: 2
    # Plain text only. Other plugins print this verbatim, so no MiniMessage tags here.
    # Placeholders: %symbol%, %amount%, %currency%
    format: "%symbol%%amount%"
    # Used for TriTown's own messages. MiniMessage, same placeholders.
    rich-format: "<gold>%symbol%%amount%</gold>"

  # Balance granted to a player the first time they join.
  starting-balance: 200.0
  # Largest balance an account may hold. Set to 0 to remove the cap.
  # A payment that would break the cap fails rather than being trimmed to fit.
  balance-cap: 1000000000.0
  # Smallest amount /pay will accept.
  minimum-payment: 0.01
  # Whether a withdrawal may take an account below zero.
  allow-negative-balances: false

  commands:
    # Register /balance, /pay and /baltop as commands of their own. When false they are
    # only reachable as /tritown balance, /tritown pay and so on. Needs a restart.
    # Another plugin that already owns one of these names keeps it either way; TriTown's
    # version stays reachable as /tritown:balance.
    top-level-aliases: true
    # Entries per page of /baltop.
    baltop-size: 10
    # List town and nation banks alongside players. Off by default, because Towny already
    # shows those and caches them, so the two lists would disagree.
    baltop-include-towns: false

  storage:
    # Where balances are kept. Only "json" ships today.
    type: json
    # Seconds between writing changed accounts to disk. A crash loses at most this long.
    flush-interval: 60
    # Convert every balance when fractional-digits changes, instead of refusing to start.
    allow-rescale: false

  towny:
    # Remove a town's or nation's account when Towny deletes it. When false the account is
    # emptied but kept, so it can still be audited.
    delete-accounts-on-delete: true

  history:
    # Record every transaction to <plugin folder>/economy/transactions.log.
    enabled: true
    # How many recent entries each account keeps in memory for /eco history.
    # Only accounts that have been active since the last restart use any memory.
    max-entries-per-account: 100
    # How long rolled log files are kept. 0 keeps them forever.
    retention-days: 30
    # Size at which the log is rolled aside into a dated file.
    roll-size-mb: 16
    time-format: "yyyy-MM-dd HH:mm"

  stats:
    # Keep the figures the admin panel reads: how much currency is created and
    # destroyed each hour, what for, and how the supply is spread across players.
    # They live in <plugin folder>/economy/statistics.json and are written on the
    # same interval as balances. Turning this off empties /tritown admin.
    # Both settings here are read at startup, so changing them needs a restart.
    enabled: true
    # How many days of hourly figures to keep. 0 keeps them forever; a year of
    # them is well under a megabyte, so the cost is time to read at startup
    # rather than space.
    retention-days: 30

# ── Shops ───────────────────────────────────────────────────────────────────
# Shops the server itself runs. Everything about a shop — what it sells, what it
# costs, who may use it — is set up in game with /tritown shop, not here; these
# are the rules that apply to all of them.
#
# The goods a shop sells are created and the money paid for them leaves the
# economy, so a shop is a sink, a faucet, or both, depending on how it is priced.
shops:
  # Turn shops off entirely. Existing shops are left on disk untouched.
  enabled: true
  # Seconds between writing stock levels and sales figures to disk. A crash
  # loses at most this long of them. Changes to a shop itself are always written
  # immediately and are never at risk.
  save-interval: 60
  # A purchase costing more than this asks the player to confirm first.
  # Set to 0 to never ask.
  confirm-above: 1000.0
  # What the editor suggests an entry should pay back, as a fraction of its buy
  # price, when sell-back is switched on for it. Only a starting point — the
  # price can be changed to anything afterwards.
  sell-rate: 0.5
  # The shop /trades opens. It is created empty if it does not exist, is edited
  # like any other shop, and cannot be deleted while it is named here. Point
  # this at a different id to make that shop the one players reach from
  # anywhere. Lowercase letters, digits, dashes and underscores only.
  global-id: trades

  # Money taken off a purchase for players who have earned it, as a fraction:
  # 0.1 is ten percent off. Discounts do not stack, so a player who matches more
  # than one gets the largest.
  discounts:
    has-town: 0.0
    has-nation: 0.0
    is-mayor: 0.0
    is-king: 0.0

# ── Player Trades ───────────────────────────────────────────────────────────
# Trading between two players, face to face. Shift-right-click the other player
# or run /trade <player>; they have to agree before the menu opens, and both of
# you have to confirm before anything changes hands.
#
# Items leave your inventory the moment you put them up and are held by the
# trade until it goes through, so what the other side is looking at cannot be
# spent behind their back. Anything a trade is holding goes straight back if it
# is called off, if either of you closes the menu, or if one of you disconnects.
player-trades:
  # Turn player trading off entirely. /trade then says so, and shift-right-clicking
  # another player does nothing.
  enabled: true
  # How close the two of you have to be, in blocks. You also have to stay that
  # close: walking away — or leaving the world they are in — calls the trade off
  # and hands everything back.
  distance: 10.0
  # Seconds an unanswered request stands before it lapses.
  request-expiry: 60

# ── Towns ───────────────────────────────────────────────────────────────────
towns:
  # Money set aside for a player's first town, on top of their starting balance.
  # Only /t new can spend it: TriTown takes it off the price Towny charges, so a
  # new player who spends their balance by mistake can still found a town.
  # Every player without a town is given it once, the next time they join, and
  # joining someone else's town gives it up. It is never paid out as money.
  # Set to 0 to turn it off.
  founding-credit: 100.0

# ── Sidebar ─────────────────────────────────────────────────────────────────
# The scoreboard shown at the right of the screen. Each board names a condition
# and a priority, and a player sees the highest-priority board whose condition
# matches where they are standing — so the same player gets different
# information at home, on someone else's land, and out in the wild.
#
# Every board is wrapped in the shared header and footer below, so the frame is
# written once rather than repeated in each board. The three of them count
# towards the fifteen lines Minecraft allows, leaving twelve per board.
#
# Lines name a translation key, so the wording and colours live in
# plugins/TriTown/lang/ and each player reads the sidebar in their own language.
# An empty entry is a blank spacer.
#
# Values are written into a line as %marker%. Available markers:
#   Town    %town% %town_level% %town_residents% %town_online% %town_claims%
#           %town_claims_max% %town_claims_free% %town_bank% %town_upkeep%
#           %town_mayor% %town_warning% %newday%
#   Nation  %nation% %nation_level% %nation_towns% %nation_residents%
#           %nation_bank% %nation_upkeep% %nation_king% %nation_capital%
#   Plot    %plot_town% %plot_nation% %plot_type% %plot_owner% %plot_price%
#           %plot_coords% %plot_pvp% %plot_mobs%
#   Money   %balance% %balance_raw% %baltop_rank%
#
# Conditions: always, no-town, has-town, no-nation, has-nation, in-wilderness,
#   in-own-town, in-own-plot, in-other-town, in-ally-town, in-enemy-town,
#   town-has-warning
scoreboard:
  # Turn the sidebar off entirely.
  enabled: true
  # Seconds between redraws of a sidebar nothing has changed on. Claims, bank
  # movements and the new day redraw it immediately anyway, so this only bounds
  # how stale the countdown can get.
  refresh-interval: 2
  # Whether a player who has never run /tritown scoreboard sees one.
  default-on: true
  # Ticks between title frames. Leave a single frame to switch the animation off.
  title-frame-interval: 8
  # The server name, as a gold gradient whose highlight sweeps across it.
  title:
    - scoreboard.title.frame-1
    - scoreboard.title.frame-2
    - scoreboard.title.frame-3
    - scoreboard.title.frame-4

  # Prepended to every board, under the title.
  header:
    - scoreboard.frame.divider

  # Appended to every board.
  footer:
    - scoreboard.frame.divider
    - scoreboard.frame.website

  boards:
    # Having no town comes before everything else: a new player needs pointing
    # at how to get one, not a readout of land they do not own.
    townless:
      priority: 90
      condition: no-town
      lines:
        - scoreboard.section.you
        - scoreboard.line.balance
        - ""
        - scoreboard.line.townless-hint
        - scoreboard.line.townless-action
        - ""
        - scoreboard.line.coords

    enemy-town:
      priority: 60
      condition: in-enemy-town
      lines:
        - scoreboard.line.enemy-warning
        - ""
        - scoreboard.section.here
        - scoreboard.line.plot-town
        - scoreboard.line.plot-nation
        - scoreboard.line.plot-summary
        - ""
        - scoreboard.section.you
        - scoreboard.line.balance

    own-town:
      priority: 40
      condition: in-own-town
      lines:
        - scoreboard.section.town
        - scoreboard.line.town-title
        - scoreboard.line.town-residents
        - scoreboard.line.town-claims
        - scoreboard.line.town-bank
        - scoreboard.line.town-upkeep
        # Renders blank while the town is healthy, so it doubles as the spacer.
        - scoreboard.line.town-warning
        - scoreboard.section.here
        - scoreboard.line.plot-summary
        - ""
        - scoreboard.section.you
        - scoreboard.line.balance

    other-town:
      priority: 30
      condition: in-other-town
      lines:
        - scoreboard.section.here
        - scoreboard.line.plot-town
        - scoreboard.line.plot-nation
        - scoreboard.line.plot-summary
        - scoreboard.line.plot-price
        - ""
        - scoreboard.section.town
        - scoreboard.line.town-title
        - scoreboard.line.town-claims
        - ""
        - scoreboard.section.you
        - scoreboard.line.balance

    wilderness:
      priority: 20
      condition: in-wilderness
      lines:
        - scoreboard.section.here
        - scoreboard.line.wilderness
        - scoreboard.line.coords
        - ""
        - scoreboard.section.town
        - scoreboard.line.town-title
        - scoreboard.line.town-claims
        - scoreboard.line.town-bank
        - scoreboard.line.town-upkeep
        - ""
        - scoreboard.section.you
        - scoreboard.line.balance

    # Never reached by the boards above, which already cover every place a
    # player can stand. Kept so that editing one of their conditions cannot
    # leave someone with a stale sidebar.
    fallback:
      priority: 0
      condition: always
      lines:
        - scoreboard.section.you
        - scoreboard.line.balance
        - scoreboard.line.coords
