# TriTown - 简体中文 (zh_CN)
#
# 值使用 MiniMessage 格式 (https://docs.advntr.dev/minimessage/format.html)。请保留每一个 {占位符}：TriTown 会填充它们。
# 此文件缺少的键会回退到内置的同语言文件，再回退到英文。
# 编辑后请执行 /tritown reload。

command:
  usage: "用法：/{command} <subcommand>"
  available: "可用子命令：{commands}"
  unknown: "未知子命令：{command}"
  no-permission: "<red>你没有权限使用该命令！"

  # 帮助列表为纯文本，不要使用 MiniMessage 标签。
  category:
    general: "通用"
    economy: "经济"
    info: "信息"
    moderation: "管理"
    shop: "商店"
    admin: "管理"

  help:
    header: "TriTown 命令"
    description: "显示所有可用命令"

  admin:
    description: "打开管理面板"
    players-only: "<red>管理面板是菜单，只有玩家能打开。"
