# TriTown - 简体中文 (zh_CN)
#
# 值使用 MiniMessage 格式 (https://docs.advntr.dev/minimessage/format.html)。请保留每一个 {占位符}：TriTown 会填充它们。
# 此文件缺少的键会回退到内置的同语言文件，再回退到英文。
# 编辑后请执行 /tritown reload。

command:
  usage: "用法：/{command} <subcommand>"
  available: "可用子命令：{commands}"
  unknown: "未知子命令：{command}"
  no-permission: "<red>你没有权限使用该命令！"

  # 帮助列表为纯文本，不要使用 MiniMessage 标签。
  category:
    general: "通用"
    economy: "经济"
    info: "信息"
    moderation: "管理"
    shop: "商店"
    trade: "交易"
    admin: "管理"
    menu: "菜单"
    news: "公告"
    storage: "仓库"

  help:
    header: "TriTown 命令"
    description: "显示所有可用命令"

  menu:
    description: "打开主菜单"
    players-only: "<red>主菜单是菜单，只有玩家能打开。"

  news:
    description: "阅读服务器公告"
    players-only: "<red>公告需要在菜单中阅读，只有玩家能打开。"
    unavailable: "<red>本服务器的公告暂时不可用。"
    unknown: "<red>没有这篇公告。"
    all-read: "已将所有公告标记为已读。"
    usage: "<red>用法：<white>/tritown news [open <id>|readall|manage]</white>"

  admin:
    description: "打开管理面板"
    players-only: "<red>管理面板是菜单，只有玩家能打开。"
    unknown-section: "<red>管理面板没有 <white>{section}</white> 这个分区。"
    no-permission-section: "<red>你没有权限打开 <white>{section}</white> 分区！"
    unavailable: "<red>管理面板暂时不可用。"

  reload:
    description: "重新载入插件配置与语言文件"
    done: "配置已重新载入！"
    error: "<red>错误：插件实例类型不匹配，无法重新载入配置。"

  balance:
    description: "查看你的余额"
    yours: "你的余额：<white>{balance}</white>"
    founding-credit: "建镇资金：<white>{amount}</white> <gray>（仅可用于 /t new 创建城镇）"
    other: "<white>{name}</white>：<white>{balance}</white>"
    console-needs-player: "<red>请指定一名玩家：<white>/balance <player></white>"
    no-permission-others: "<red>你没有权限查看其他玩家的余额！"

  pay:
    description: "向其他玩家付款"
    players-only: "<red>只有玩家可以付款。控制台请使用 <white>/eco give</white>。"
    usage: "<red>用法：<white>/pay <player> <amount></white>"
    minimum: "<red>最小付款金额为 <white>{amount}</white>。"
    self: "<red>你不能向自己付款。"
    government: "<red>请使用 Towny 自带的存款命令向城镇或国家银行付款。"
    server-account: "<red>你不能向服务器账户付款。"
    no-account: "<red>无法打开你的账户。"
    sent: "已向 <white>{name}</white> 支付 <white>{amount}</white>。余额：<white>{balance}</white>"
    received: "<white>{name}</white> 向你支付了 <white>{amount}</white>。"

  baltop:
    description: "列出最富有的玩家"
    empty: "<gray>目前还没有人拥有金钱。"
    header: "<gold><bold>财富排行</bold></gold> <gray>（第 {page}/{pages} 页）"
    entry: "<gray>{rank}.</gray> <white>{name}</white>{tag} <dark_gray>-</dark_gray> <white>{balance}</white>"
    tag: " <gray>[{type}]</gray>"
    updated: "<dark_gray>更新于{age}。"
    age:
      now: "刚刚"
      seconds: "{seconds} 秒前"
      minute: "一分钟前"
      minutes: "{minutes} 分钟前"

  eco:
    description: "管理玩家余额"
    no-permission-action: "<red>你没有权限使用 <white>/eco {action}</white>！"
    flushing: "正在将变动的账户写入磁盘。"
    target-usage: "<red>用法：<white>/eco {action} <player></white>"
    amount-usage: "<red>用法：<white>/eco {action} <player> <amount></white>"
    unknown-currency: "<red>未知货币 <white>{currency}</white>。"
    changed-by-admin: "<gray>你的余额已被管理员修改。"
    gave: "已向 <white>{name}</white> 发放 <white>{amount}</white>。余额：<white>{balance}</white>"
    took: "已从 <white>{name}</white> 扣除 <white>{amount}</white>。余额：<white>{balance}</white>"
    set: "已将 <white>{name}</white> 设置为 <white>{amount}</white>。余额：<white>{balance}</white>"
    reset: "已将 <white>{name}</white> 重置为 <white>{balance}</white>"
    info:
      header: "<gold><bold>{name}</bold></gold>"
      uuid: "<gray>UUID：</gray> <white>{uuid}</white>"
      type: "<gray>类型：</gray> <white>{type}</white>"
      created: "<gray>创建于：</gray> <white>{date}</white>"
      updated: "<gray>更新于：</gray> <white>{date}</white>"
      balance: "<gray>{currency}：</gray> <white>{balance}</white>"
    history:
      players-only: "<red>只有玩家可以打开交易记录界面。"
      no-permission-others: "<red>你没有权限查看其他账户的交易记录！"
      unavailable: "<red>交易记录界面不可用。"
    usage:
      header: "<gold><bold>经济管理</bold></gold>"
      give: "<white>/eco give <player> <amount> [currency]</white> <gray>- 发放金钱"
      take: "<white>/eco take <player> <amount> [currency]</white> <gray>- 扣除金钱"
      set: "<white>/eco set <player> <amount> [currency]</white> <gray>- 直接设置余额"
      reset: "<white>/eco reset <player></white> <gray>- 重置为初始余额"
      info: "<white>/eco info <player></white> <gray>- 账户详情"
      history: "<white>/eco history [player]</white> <gray>- 浏览交易记录"
      flush: "<white>/eco flush</white> <gray>- 立即将变动的账户写入磁盘"

  scoreboard:
    description: "显示或隐藏侧边栏"
    players-only: "<red>只有玩家才有侧边栏。"
    unavailable: "<red>本服务器已关闭侧边栏。"
    usage: "<red>用法：<white>/tritown scoreboard [on|off]</white>"
    shown: "已显示侧边栏。"
    hidden: "已隐藏侧边栏。"
    pinned: "侧边栏已固定为 <white>{board}</white> 板面。"
    unpinned: "侧边栏已恢复为根据所在位置自动切换。"
    unknown-board: "<red>不存在名为 <white>{board}</white> 的板面。"

  storage:
    description: "打开你的仓库"
    players-only: "<red>仓库是一个菜单，只有玩家才能打开。"
    usage: "<red>用法：<white>/tritown storage [view <player>|pages <player> <add|set> <amount>]</white>"
    not-found: "没有名为 {name} 的玩家来过本服务器。"
    pages-set: "<white>{name}</white> 现在拥有 <white>{amount}</white> 页仓库。"

  trades:
    description: "打开服务器的全局商店"
    players-only: "<red>商店是菜单，只有玩家能打开。"
    disabled: "<red>本服务器已关闭商店功能。"
    unavailable: "<red>全局商店现在不可用。"

  trade:
    description: "向其他玩家发起交易"
    players-only: "<red>交易在菜单中进行，只有玩家能使用。"
    disabled: "<red>本服务器已关闭玩家交易功能。"
    usage: "<red>用法：<white>/trade <player></white>"
    self: "<red>你不能和自己交易。"
    not-found: "<red><white>{name}</white> 不在线。"
    busy: "<red><white>{name}</white> 正在和别人交易。"
    you-busy: "<red>你已经在交易中了。"
    too-far: "<red>你们必须站在一起才能交易。"
    sent: "已向 <white>{name}</white> 发起交易请求，对方有 <white>{seconds}秒</white> 时间回应。"
    received: "<white>{name}</white> 想和你交易。<click:run_command:'/trade accept {name}'><green><bold>[接受]</bold></green></click> <click:run_command:'/trade deny {name}'><red><bold>[拒绝]</bold></red></click>"
    expired: "<gray>你向 <white>{name}</white> 发起的交易请求已过期。"
    no-requests: "<red>没有人向你发起交易请求。"
    no-request: "<red><white>{name}</white> 没有向你发起交易请求。"
    which-request: "<red>有多个玩家发起了请求，请指明是谁：<white>{names}</white>"
    denied: "已拒绝 <white>{name}</white> 的交易请求。"
    denied-by: "<white>{name}</white> 拒绝了你的交易请求。"

  shop:
    description: "管理服务器商店"
    disabled: "<red>本服务器已关闭商店功能。"
    unavailable: "<red>商店加载失败，请查看服务器日志。"
    no-permission-action: "<red>你没有权限使用 <white>/tritown shop {action}</white>。"
    players-only: "<red>只有玩家能打开菜单。"
    unknown: "<red>没有 id 为 <white>{id}</white> 的商店。"
    created: "已创建商店 <white>{id}</white>。"
    create-failed: "<red><white>{id}</white> 已被占用或不是有效的 id。请使用小写字母、数字、短横线和下划线。"
    delete-confirm: "<red>删除商店无法撤销。请执行 <white>/tritown shop delete {id} confirm</white> 继续。"
    delete-global: "<red><white>{id}</white> 是 <white>/trades</white> 打开的商店，无法删除。请在编辑器中清空它，或将 <white>shops.global-id</white> 指向其他商店。"
    deleted: "已删除商店 <white>{id}</white>。"
    opened: "已为 <white>{player}</white> 打开商店 <white>{id}</white>。"
    bound: "<white>{npc}</white> 现在会打开商店 <white>{id}</white>。"
    unbound: "<white>{npc}</white> 不再打开商店 <white>{id}</white>。"
    npc-unknown: "<red>没有名为 <white>{npc}</white> 的 NPC。"
    npc-not-bound: "<red><white>{npc}</white> 没有绑定任何商店。"
    npcs-unavailable: "<red>未安装 {plugin}，无法绑定 NPC。"
    usage:
      header: "<gold><bold>商店管理</bold></gold>"
      list: "<white>/tritown shop list</white> <gray>- 服务器上的所有商店"
      create: "<white>/tritown shop create <id> [name]</white> <gray>- 新建一个商店"
      delete: "<white>/tritown shop delete <id> confirm</white> <gray>- 永久删除一个商店"
      edit: "<white>/tritown shop edit <id></white> <gray>- 修改商店的商品"
      open: "<white>/tritown shop open <id> [player]</white> <gray>- 为某人打开商店"
      bind: "<white>/tritown shop bind <id> <npc></white> <gray>- 让 NPC 看店"
      unbind: "<white>/tritown shop unbind <npc></white> <gray>- 解除 NPC 的商店绑定"
      stats: "<white>/tritown shop stats <id></white> <gray>- 商店的交易统计"


# 快捷栏最后一格中用于打开主菜单的物品。
menu-item:
  name: "<gradient:yellow:gold><bold>TriTown 菜单</bold></gradient>"
  lore: "<gray>右键打开菜单。<newline><dark_gray>它固定在这一格，无法丢弃、移动或存放。"
  relocated: "<gray>TriTown 菜单固定在快捷栏最后一格，原本在那里的物品已移入你的背包。"
  dropped: "<gray>TriTown 菜单固定在快捷栏最后一格，而你的背包已满，原本在那里的物品已掉落在你脚下。"
  unread: "<gold>✉ {amount} 条未读的服务器公告"

founding-credit:
  granted: "你获得了 <white>{amount}</white> 的建镇资金。使用 <white>/t new</white> 创建你的第一个城镇时会自动抵扣费用，不能用于其他任何用途。加入其他城镇会失去这笔资金。"
  applied: "你的建镇资金抵扣了 <white>{amount}</white> 的城镇创建费用。"
  forfeited: "<gray>你已加入一个城镇，建镇资金已失效。"

# 服务器公告：在游戏内撰写、从主菜单阅读的更新日志。
news:
  # 单条条目的显示格式：先是标签，然后是内容。
  entry: "{tag} <gray>{text}"
  tag:
    new: "<green>✚ 新增</green>"
    changed: "<gold>✎ 调整</gold>"
    fixed: "<dark_aqua>✔ 修复</dark_aqua>"
    removed: "<red>✖ 移除</red>"
    note: "<gray>✦ 备注</gray>"
  join:
    header: "<gold>✉</gold> 你有 <white>{amount}</white> 条未读的服务器公告："
    entry: " <dark_gray>•</dark_gray> <click:run_command:'/tritown news open {id}'><white>{title}</white> <yellow>[阅读]</yellow></click>"
    more: " <dark_gray>……还有 {amount} 条。"
    open: " <click:run_command:'/tritown news'><gold><bold>[打开公告]</bold></gold></click>"
  broadcast:
    title: "<gold><bold>服务器更新</bold></gold>"
    chat: "<gold>✉ 新的服务器公告：</gold> <white>{title}</white> <click:run_command:'/tritown news open {id}'><yellow><bold>[阅读]</bold></yellow></click>"
  # 以成书形式显示的公告。书页底色较浅，深色文字更易阅读。
  book:
    title: "<bold>{title}</bold>"
    label: "<dark_gray>{label}"
    date: "<dark_gray>{date}"
    summary: "{text}"
    category: "<bold><underlined>{name}</underlined></bold>"
    entry: "{tag} <black>{text}"
  editor:
    created: "已创建草稿。添加分类后，准备好即可发布。"
    deleted: "公告已删除。"
    published: "公告已发布。"
    unpublished: "公告已撤回为草稿，玩家将无法再看到它。"
    publish-empty: "<red>公告至少需要一条条目才能发布。"
    category-removed: "分类已移除。"
    entry-added: "已添加：{entry}"
    entry-removed: "条目已移除。"
    too-long: "<red>内容太长了，请控制在 <white>{amount}</white> 个字符以内。"

common:
  unknown: "未知"
  invalid-amount: "<red>这不是有效的金额。"
  economy-unavailable: "<red>本服务器的经济系统不可用。"
  no-account: "<red>找不到 <white>{name}</white> 的账户。"
  # 用于包裹 money.error.* 的信息，后者为纯文本以便其他插件直接输出。
  error: "<red>{message}"
  duration: "{hours}小时{minutes}分"
  "on": "开"
  "off": "关"
  # 当侧边栏变量没有对应的值时显示，例如没有城镇的玩家的城镇名。
  none: "-"

  prompt-cancel: "<dark_gray>输入 <white>cancel</white> 可保持不变。"
  prompt-cancelled: "<gray>已取消，未做修改。"

money:
  # 仅限纯文本：这些信息会作为 Vault 的错误信息传给其他插件，并被原样输出。
  error:
    negative-amount: "金额不能为负数"
    too-large: "该金额过大，无法持有"
    balance-cap: "已达到余额上限"
    recipient-balance-cap: "收款方已达到余额上限"
    insufficient-funds: "余额不足"
    negative-balance: "余额不能为负数"
    same-account: "不能向同一账户转账"
    unavailable: "经济系统不可用"
    no-account: "该账户不存在"
    unusable-amount: "金额不是可用的数值"
    account-not-created: "无法创建该账户"
    no-banks: "TriTown 不提供 Vault 银行账户"

  # 交易发生的原因，显示在交易记录界面中。这些原因会以键的形式写入交易日志，
  # 因此无论服务器之后切换到哪种语言，记录都仍然可读。
  reason:
    external: "外部插件"
    starting-balance: "初始余额"
    payment: "玩家付款"
    towny: "Towny"
    town-deleted: "{name} 已被删除"
    admin-set: "由 {admin} 设置"
    admin-reset: "由 {admin} 重置"
    shop-buy: "在 {shop} 购买"
    shop-sell: "在 {shop} 出售"
    trade: "玩家交易"
    storage-page: "仓库第 {page} 页"

  # 资金的来源与去向，管理面板按此归类统计。
  flow:
    starting-balance: "新玩家"
    shop: "商店"
    storage: "仓库页"
    towny: "Towny"
    admin: "管理操作"
    payment: "玩家转账"
    external: "其他插件"
    other: "未归类"

  # 交易的发起方。TriTown 不认识的来源会按记录原样显示。
  source:
    vault: "其他插件"
    command: "TriTown 命令"
    towny: "Towny"
    shop: "商店"
    storage: "仓库"

  account-type:
    player: "玩家"
    town: "城镇"
    nation: "国家"
    npc: "NPC"
    server: "服务器"
    unknown: "未知"

  transaction:
    deposit: "收入"
    withdraw: "支出"
    transfer-in: "转入"
    transfer-out: "转出"
    set: "余额设置"
    closed: "账户关闭"

