    economy-net: "<gray>Net over {window}: {amount}"
    economy-accounts: "<gray>Accounts: <white>{amount}</white>"
    economy-stats-off: "<red>Statistics are switched off in config.yml."
    shops: "<green><bold>Shops</bold></green>"
    shops-lore: "<gray>What every shop has traded."
    shops-count: "<gray>Shops: <white>{amount}</white>"
    shops-taken: "<gray>Taken in: <gold>{amount}</gold>"
    shops-paid: "<gray>Paid out: <green>{amount}</green>"
    shops-off: "<red>Shops are switched off."
